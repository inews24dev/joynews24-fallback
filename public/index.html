        @media (min-width: 768px) {
        main {
            width: 768px;
            margin: 0px auto;

        }

        html,body{
                font-family: 'Noto Sans CJK KR Regular', 'Apple SD Gothic Neo', 'Sans-serif', Sans-serif, serif, 'system-ui';
                margin: 0px;
                background-color: #ececec;

            }
            main{
                background-color: white;
                padding:0px 10px;
                height: 100%;
            }
            header {
                text-align: center;
                height: 53px;
                vertical-align: middle;
                line-height: 53px;
                border-bottom: 2px solid #eff2f8;
            }
            header > svg{
                height:30px;
                vertical-align: middle;
            }

            h1{
                color: black;
                font-size: 32px;
                line-height: 38px;
                margin-top: 16px;
                font-weight: 700;
            }
            hgroup{
                border-left:2px solid black;
            
            }


            h2{
                padding-left: 10px;
                color: black;
                font-size: 20px;
                line-height: 25px;
                margin-top: 15px;
                font-weight: 500;
            }
            time{
                display: block;
                font-size: 12px;
                color: #595959;
                font-weight: normal;
            }

            address{
                font-size: 12px;
                font-style: normal;
                color: #595959;
            }

            article{
                min-height: calc(100% - 300px);
            }
            footer{
                --height:100px;
                line-height: var(--height);
                height: var(--height);
                text-align: center;
                font-size: 12px;
                color: #666;
                
            }

            figure{
                margin: 0px;
                padding: 0px;
                text-align: center;
            }
            figure img{
                max-width: 100%;
                object-fit: contain;
                height: auto;
                text-align: center;

            }

            figcaption{
                text-align: center;
                color: #595959;
                font-size: 14px;
                line-height: 18px;
                padding: 10px;
            }

            a:link {
                text-decoration: none;
            }

            a {
                color: inherit;
            }

    </style>
